services:
  db:
    image: postgres:15
    container_name: greaterevents_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: insecure
      POSTGRES_DB: pdyc2026
      TZ: "UTC"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
